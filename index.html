<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Santri</title>
    
    <meta name="theme-color" content="#1a5f7a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nilai HSI">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="mainContainer">
        <!-- HALAMAN PILIHAN PROGRAM -->
        <div id="halamanPilihan">
            <div class="header">
                <div class="header-icon">🎓</div>
                <h1>Nilai Santri</h1>
                <p>Pilih Program Silsilah</p>
            </div>
            <div class="program-grid" id="programList"></div>
        </div>

        <!-- HALAMAN PENCARIAN -->
        <div id="halamanPencarian" style="display:none;">
            <div class="header">
                <div class="header-icon">🎓</div>
                <h1>Nilai Santri</h1>
                <p id="judulProgram">-</p>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Ketik nama santri..." autocomplete="off">
                <button onclick="searchSantri()">🔍 Cari</button>
            </div>
            <button class="btn-kembali" onclick="kembaliKePilihan()">⬅ Kembali ke Pilihan Program</button>
            <div id="totalSantri" class="total-info"></div>
            <div id="suggestions" class="suggestions"></div>
            <div id="result" class="result"></div>
        </div>

        <div id="loading" class="loading" style="display: none;"><p>⏳ Memuat data...</p></div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
